const grid=document.getElementById("prophetGrid");
const home=document.getElementById("homePage");
const page=document.getElementById("storyPage");

function renderGrid(list){
 grid.innerHTML="";
 list.forEach((p)=>{
  const card=document.createElement("div");
  card.className="card";
  const symbol=document.createElement("div");
  symbol.className="symbol";
  symbol.textContent="☪";
  const title=document.createElement("h3");
  title.textContent=p.name;
  card.append(symbol,title);
  card.onclick=()=>openStory(p);
  grid.appendChild(card);
 });
}

function searchProphets(){
 const value=document.getElementById("search").value.trim();
 renderGrid(prophets.filter(p=>p.name.includes(value)));
}

function openStory(p){
 home.style.display="none";
 page.style.display="block";
 document.getElementById("storyTitle").textContent=p.name;
 const content=document.getElementById("storyContent");
 content.innerHTML="";
 p.story.forEach((section)=>{
  const box=document.createElement("div");
  box.className="section";
  const h=document.createElement("h3");
  h.textContent=section[0];
  const para=document.createElement("p");
  para.textContent=section[1];
  box.append(h,para);
  content.appendChild(box);
 });
 window.scrollTo({top:0,behavior:"smooth"});
}

function goBack(){
 page.style.display="none";
 home.style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}

renderGrid(prophets);
</script>
